# Gera os dados por zona eleitoral e local de votação (ADR 0008) e grava no próprio branch.
# Rodar pela aba Actions ("Run workflow") ou: gh workflow run dados-zonas-locais.yml --ref <branch>
#
# Passos:
#   1. corrigir-anulados: marca votos anulados, vices e coligações a partir do TSE (só ~120 arquivos);
#   2. zonas-locais: baixa os dados abertos por seção do TSE (~3 GB) e soma por zona e por bairro
#      (bairros do IBGE em public/geo/bairros, gerados por scripts/bairros.mjs; nas outras cidades, o bairro do TSE);
#   3. testes e commit dos arquivos gerados em public/.
name: Dados de zonas e locais

on:
  workflow_dispatch:
  # também quando o próprio processamento muda (o commit de dados só mexe em public/, então não entra em laço)
  push:
    paths:
      - .github/workflows/dados-zonas-locais.yml
      - scripts/zonas-locais.mjs
      - scripts/lib/texto.mjs
      - public/geo/bairros/**
      - scripts/corrigir-anulados.mjs

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Corrigir votos anulados, vices e coligações
        run: node scripts/corrigir-anulados.mjs

      - name: Zonas eleitorais e bairros
        run: |
          rm -rf public/data/2026/*/*/locais   # resultados por local foram substituídos pelos bairros (ADR 0009)
          node --max-old-space-size=10000 scripts/zonas-locais.mjs --baixar

      - name: Testes
        run: npm test

      - name: Gravar no branch
        run: |
          git config user.name "Matheus Sigoli"
          git config user.email "dev.matheussigoli@gmail.com"
          git add -A public/data public/geo/zonas public/geo/locais
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --author="Matheus Sigoli <dev.matheussigoli@gmail.com>" \
            -m "Dados: zonas eleitorais e locais de votação (gerado pelo GitHub Actions)"
          git push
