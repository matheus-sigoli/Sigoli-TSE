# Sonda temporária: baixa as fontes de 1989/1990 e as micro/mesorregiões do IBGE e grava em sonda/
name: Sonda 1989
on:
  push:
    branches: [sonda-1989]
    paths: [.github/workflows/sonda-1989.yml]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          set +e
          mkdir -p sonda89 && cd sonda89
          G=https://geografiadovoto.com/data/1989
          for f in resultado1989.1.json resultado1989.2.json resultado1989.1.zz resultado1989.2.zz cand1989.json legenda1989.1.json legenda1989.2.json mapa1989BR.svg; do
            curl -sL --max-time 120 -o $f -w "%{http_code} %{size_download} $G/$f\n" "$G/$f" >> status.txt
          done
          ls -la >> status.txt
      - name: Gravar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sonda89 && git commit -m "sonda 1989 dados [skip ci]" && git push
