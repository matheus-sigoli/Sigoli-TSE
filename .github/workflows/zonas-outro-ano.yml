# Desenho das zonas de um ano sem locais de votação a partir de outro ano (scripts/zonas-de-outro-ano.mjs).
# Roda no push destes arquivos; .github/zonas-outro-ano tem "ANO DE" (ex.: "1994 1998").
name: Zonas de outro ano
on:
  push:
    paths:
      - .github/workflows/zonas-outro-ano.yml
      - .github/zonas-outro-ano
permissions:
  contents: write
concurrency:
  group: zonas-outro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  zonas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        run: npm install --no-audit --no-fund
      - name: Zonas
        run: |
          read ANO DE < .github/zonas-outro-ano
          echo "ANO=$ANO" >> $GITHUB_ENV
          node --max-old-space-size=8000 scripts/zonas-de-outro-ano.mjs --ano $ANO --de $DE
          node scripts/simplificar-topo.mjs --tol 0.0006 public/geo/$ANO/zonas/*.json public/geo/$ANO/zonas-cidade/*.json
      - name: Gravar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo/$ANO
          git diff --cached --quiet && exit 0
          git commit -m "Zonas de $ANO [skip ci]" && git pull --rebase && git push
