# Gera os dados de uma eleição municipal (Prefeito e Vereador) a partir dos dados abertos do TSE e grava no próprio branch.
#
# Passos:
#   1. municipal-tse: arquivos das UFs por município, resumo do Brasil e as bases com todos os candidatos;
#   2. malha-ano: malha municipal do ano;
#   3. zonas-locais (modo municipal): zonas, bairros e locais de votação + um arquivo por cidade;
#   4. areas-ano: áreas dos locais (Atlas 2026);
#   5. commit de public/data/{ano} e public/geo/{ano}.
name: Dados de eleição municipal
on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano da eleição municipal
        default: '2024'
  push:
    paths:
      - .github/workflows/dados-municipal.yml
      - scripts/municipal-tse.mjs

permissions:
  contents: write

concurrency:
  group: municipal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Ano
        run: echo "ANO=${{ github.event.inputs.ano || '2024' }}" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Resultados por município
        run: node --max-old-space-size=12000 scripts/municipal-tse.mjs --ano $ANO --baixar

      - name: Conferência
        run: |
          node -e "
          const fs = require('fs');
          const ler = (p) => JSON.parse(fs.readFileSync('public/data/$ANO/' + p, 'utf8'));
          for (const [uf, ibge] of [['sp', '3550308'], ['rj', '3304557'], ['mg', '3106200']]) {
            for (const t of [1, 2]) {
              if (!fs.existsSync('public/data/$ANO/prefeito/' + t + '/' + uf + '.json')) continue;
              const a = ler('prefeito/' + t + '/' + uf + '.json');
              const r = a.mun[ibge];
              if (!r) continue;
              const l = []; for (let i = 0; i < r.c.length; i += 2) l.push([a.cands[r.c[i]], r.c[i + 1]]);
              console.log('Prefeito', t, ibge, 'válidos', r.t[3], l.slice(0, 4).map(([c, v]) => c.nome + ' ' + c.partido + ' ' + (100 * v / r.t[3]).toFixed(2) + '% ' + c.situacao).join(' | '));
            }
          }
          const b = ler('prefeito/1/br.json'); console.log('Prefeituras (1º turno) por partido:', b.bancadas.slice(0, 8).map((x) => x.join(' ')).join(', '));
          const v = ler('vereador/1/br.json'); console.log('Vereadores por partido:', v.bancadas.slice(0, 8).map((x) => x.join(' ')).join(', '));
          "

      - name: Malha municipal do ano
        run: node scripts/malha-ano.mjs --ano $ANO

      - name: Zonas, bairros e locais de votação (um arquivo por cidade)
        run: node --max-old-space-size=14000 scripts/zonas-locais.mjs --ano $ANO --baixar

      - name: Simplificar as bordas das zonas (~65 m)
        run: node scripts/simplificar-topo.mjs --tol 0.0006 public/geo/$ANO/zonas/*.json public/geo/$ANO/zonas-cidade/*.json

      - name: Áreas dos locais (Atlas 2026)
        run: node scripts/areas-ano.mjs --ano $ANO

      - name: Tamanho
        run: |
          echo "arquivos: $(find public/data/$ANO public/geo/$ANO -type f | wc -l)"; du -sh public/data/$ANO public/geo/$ANO
          ls -S -l public/data/$ANO/vereador/1/cidade | head -5

      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/$ANO public/geo/$ANO
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit --author="Matheus Sigoli <dev.matheussigoli@gmail.com>" -m "Dados: eleições municipais de $ANO (gerado pelo GitHub Actions)"
          git pull --rebase
          git push
