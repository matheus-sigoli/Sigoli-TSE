# Gera os dados de uma eleição anterior (ADR 0015) a partir dos dados abertos do TSE e grava no próprio branch.
# Roda no push destes arquivos (ano padrão abaixo) ou pela aba Actions, depois que estiver no main.
#
# Passos:
#   1. ano-tse: resultados por município (votação por município/zona, partidos, totais, vices);
#   2. malha-ano: malha municipal do ano (municípios criados depois voltam à origem);
#      zonas-locais --ano: zonas (desenho data/zonas/ZMBRA_{ano}.json quando houver), bairros e locais (votação por seção);
#   3. areas-ano: casa os locais do ano com as áreas do Atlas Eleitoral 2026;
#   4. pintam --ano: quem pinta o mapa (regras de cores, ADR 0014);
#   5. testes e commit de public/data/{ano} e public/geo/{ano}.
name: Dados de outro ano
on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano da eleição
        default: '2022'
  push:
    paths:
      - .github/workflows/dados-ano.yml
      - scripts/ano-tse.mjs
      - scripts/areas-ano.mjs
      - scripts/lib/dadosabertos.mjs
      - scripts/malha-ano.mjs
      - scripts/zonas-locais.mjs
      - data/exterior/cidades-pais.csv
      - data/zonas/ZMBRA_*
      - .github/ano-dados

permissions:
  contents: write

concurrency:
  group: dados-${{ github.ref }}
  cancel-in-progress: false


jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ano: o informado na aba Actions; no push, o de .github/ano-dados (cada branch de ano grava o seu)
      - name: Ano
        run: echo "ANO=${{ github.event.inputs.ano }}" >> $GITHUB_ENV; [ -n "${{ github.event.inputs.ano }}" ] || echo "ANO=$(cat .github/ano-dados 2>/dev/null || echo 2022)" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Resultados por município
        run: node --max-old-space-size=10000 scripts/ano-tse.mjs --ano $ANO --baixar

      - name: Conferência (totais nacionais e estaduais)
        run: |
          node -e "
          const ler = (p) => JSON.parse(require('fs').readFileSync('public/data/$ANO/' + p, 'utf8'));
          for (const t of [1, 2]) {
            if (!require('fs').existsSync('public/data/$ANO/presidente/' + t + '/br.json')) continue;
            const a = ler('presidente/' + t + '/br.json');
            console.log('Presidente', t, 'turno: válidos', a.total.t[3], '| comparecimento', a.total.t[1], '| brancos', a.total.t[4], '| nulos', a.total.t[5]);
            a.cands.slice(0, 4).forEach((c, i) => console.log('  ', c.nome, c.partido, a.total.c[i], (100 * a.total.c[i] / a.total.t[3]).toFixed(2) + '%', c.situacao));
          }
          for (const uf of ['sp', 'mg', 'rj']) {
            const g = ler('governador/1/' + uf + '.json');
            console.log('Governador', uf, g.cands.slice(0, 3).map((c, i) => c.nome + ' ' + (100 * g.total.c[i] / g.total.t[3]).toFixed(2) + '% ' + c.situacao).join(' | '));
          }
          "

      # anos sem votação por seção com local (1998): zonas pela votação por município e zona
      - name: Zonas pela votação por município e zona (anos sem locais)
        if: ${{ env.ANO < 2002 }}
        run: |
          node --max-old-space-size=10000 scripts/ano-tse.mjs --ano $ANO --zonas
          [ -f data/sig/$ANO.json ] && node --max-old-space-size=6000 scripts/sig-presidente.mjs --ano $ANO
          node scripts/propor-fusoes.mjs --ano $ANO --depois $([ "$ANO" = 1994 ] && echo 1998 || echo 2002)

      - name: Malha municipal do ano (municípios criados depois voltam à origem)
        run: node scripts/malha-ano.mjs --ano $ANO

      - name: Desenho das zonas a partir de 2002 (anos sem locais)
        if: ${{ env.ANO < 2002 }}
        run: node scripts/zonas-de-outro-ano.mjs --ano $ANO --de 2002

      - name: Zonas, bairros e locais de votação
        if: ${{ env.ANO >= 2002 }}
        run: node --max-old-space-size=12000 scripts/zonas-locais.mjs --ano $ANO --baixar

      - name: Simplificar as bordas das zonas (~65 m)
        run: node scripts/simplificar-topo.mjs --tol 0.0006 public/geo/$ANO/zonas/*.json public/geo/$ANO/zonas-cidade/*.json

      - name: Áreas dos locais (Atlas 2026)
        if: ${{ env.ANO >= 2002 }}
        run: node scripts/areas-ano.mjs --ano $ANO

      - name: Quem pinta o mapa
        run: node scripts/pintam.mjs --ano $ANO

      - name: Testes
        run: npm test

      - name: Gravar no branch
        run: |
          # o bot é quem grava (committer); o autor é o dono do projeto. A identidade vale também para o rebase.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/$ANO public/geo/$ANO
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit --author="Matheus Sigoli <dev.matheussigoli@gmail.com>" -m "Dados: eleições de $ANO (gerado pelo GitHub Actions)"
          git pull --rebase
          git push
